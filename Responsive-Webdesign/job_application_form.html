<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
		input:focus, textarea:focus {
  border-color: #007BFF;
  outline:none;
}
input:invalid, select:invalid, textarea:invalid {
  border-color: red;
}
input:valid, select:valid, textarea:valid {
  border-color: green;
}

button:hover {
  background: black;
  color: white;
  cursor: pointer;

}
.radio-group input[type="radio"]:checked {
  border-color:blue; 
  background-color: lightblue;
  box-shadow: 0 0 5px blue;
}
.radio-group input[type="radio"]:checked + label {
  color: blue;
}
input:first-of-type {

  border-color:blue;
}
    </style>
</head>
<body>
    <div class="container" >
        <form>
            <label for="name">Name:</label>
            <input  type="text" id="name" placeholder="Full name" >
            <label for="email">Email: </label>
            <input type="email" id="email" placeholder="Email">
            <label for="position">Position:</label>
            <select id="position">
                    <option disabled selected >Select a postion</option>
                    <option>Fullstack-Developer</option>
                    <option>Backend-Developer</option>
                    <option>Frontend-Developer</option>
                </select>
            
            <fieldset class="radio-group">
                <legend>Availability</legend>
                <input type="radio" id="full-time" name="availability" value="full-time">
    <label for="full-time">Full-Time</label>
                
                <input type="radio" id="part-time" name="availability" value="part-time">
   
    <label for="part-time">Part-Time</label>   
            </fieldset>
            <label for="message">Why do you want this Job?</label>
            <textarea id="message"  name="message" rows="4" cols="50" placeholder="write your motivation..."></textarea>
            <button type="submit" >Submit</button>
        </form>
    </div>
</body>
</html>
