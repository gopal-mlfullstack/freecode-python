<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
	body {
  background: gray;
}

.blog-post-card {
  background: white;
  border-radius: 10px;
  width: 300px;
  text-align: center;
}

.post-img {
  width: 300px;
  height: auto;
  border-radius: 10px 10px 0 0; 
  border-bottom:5px solid whitesmoke;
  
}
.post-content {
  padding: 3px;
}
.post-title {
  font-size: 20px;
  color: rgb(87, 20, 135);
  margin:6px;

}
.post-excerpt {
  font-size: 15px;
  color: rgb(71, 67, 61);
  margin:2px
}

.read-more {
  color: white;
  background-color: rgb(42, 10, 61);
  margin: 7px;
  padding: 4px;
  border-radius: 4px;
  display:inline-block;

}
.read-more:hover {
  color: white;
  background-color: rgb(109, 66, 130);
}
    </style>
    <title>Blog Post Card</title>
</head>
<body>
    <div class="blog-post-card" >
        <img class="post-img" 
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="Post Image"
        >
        <div class="post-content" >
            <h2 class="post-title">Work Hard, Study Hard</h2>
            <p class="post-excerpt">you must dedicate total effort to gaining knowledge and then apply that same intense dedication to your career. </p>
            <a class="read-more">Read More</a>
        </div>
    </div>
</body>
</html>
